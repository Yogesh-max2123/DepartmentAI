<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNNIT Department Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <section id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-brand">
                <img src="logo.png" alt="MNNIT Allahabad emblem" width="72" height="72">
                <div>
                    <p class="eyebrow">Motilal Nehru National Institute of Technology Allahabad</p>
                    <h1>MNNIT Department Portal</h1>
                </div>
            </div>
            <p class="login-sub">B.Tech. / M.Tech. / Ph.D. departmental workflow</p>
            <form id="login-form">
                <label for="login-email">Institute email</label>
                <input id="login-email" name="email" type="email" autocomplete="username" required value="student@mnnit.ac.in">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required value="student123">
                <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
                <p id="login-error" class="form-error" hidden></p>
            </form>
            <div class="demo-accounts">
                <p>Demo accounts</p>
                <button type="button" class="chip" data-email="ug.student@mnnit.ac.in" data-password="student123">B.Tech. student</button>
                <button type="button" class="chip" data-email="student@mnnit.ac.in" data-password="student123">Ph.D. student</button>
                <button type="button" class="chip" data-email="mtech.student@mnnit.ac.in" data-password="student123">M.Tech. student</button>
                <button type="button" class="chip" data-email="official@mnnit.ac.in" data-password="official123">Official</button>
                <button type="button" class="chip" data-email="committee@mnnit.ac.in" data-password="committee123">Committee</button>
            </div>
        </div>
    </section>

    <div id="app-shell" class="app-shell" hidden>
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="MNNIT Allahabad emblem" width="40" height="40">
                <div>
                    <strong>MNNIT Department Portal</strong>
                    <span>DUGC / DMPC / DDPC</span>
                </div>
            </div>
            <nav id="nav" class="nav" aria-label="Primary"></nav>
            <div class="sidebar-user">
                <button type="button" class="avatar-btn" id="who-avatar-btn" aria-label="Open profile">
                    <img id="who-photo" alt="" hidden>
                    <span id="who-initials">—</span>
                </button>
                <div>
                    <strong id="who-name">—</strong>
                    <span id="who-role">—</span>
                </div>
                <button type="button" class="btn btn-ghost" id="profile-btn">Profile</button>
                <button type="button" class="btn btn-ghost" id="logout-btn">Sign out</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <h2 id="page-title">Dashboard</h2>
                 <p id="page-sub">B.Tech. / M.Tech. / Ph.D. application workflow</p>
            </header>
            <div id="view" class="view"></div>
        </main>
    </div>

    <div id="profile-modal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-labelledby="profile-title" aria-modal="true">
            <h3 id="profile-title">Edit profile</h3>
            <form id="profile-form">
                <div class="profile-photo-row">
                    <img id="profile-preview" alt="Profile photo preview" width="72" height="72">
                    <div>
                        <label for="profile-photo">Profile photo</label>
                        <input id="profile-photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
                    </div>
                </div>
                <label for="profile-name">Full name</label>
                <input id="profile-name" required>
                <label for="profile-phone">Phone</label>
                <input id="profile-phone" type="tel" autocomplete="tel">
                <label for="profile-dept">Department</label>
                <input id="profile-dept">
                <div class="btn-row">
                    <button class="btn btn-primary" type="submit" id="profile-save">Save</button>
                    <button class="btn btn-outline" type="button" id="profile-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
